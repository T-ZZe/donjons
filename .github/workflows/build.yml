name: Build Donjon
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compilation
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -n 1)
          echo "pom.xml trouvé : $POM"
          mvn -B -f "$POM" clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Donjon
          path: '**/target/Donjon.jar'
